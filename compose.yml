x-docpilot-env: &docpilot-env
  DOCPILOT_DATABASE_URL: ${DOCPILOT_DATABASE_URL:-postgresql+psycopg://docpilot:docpilot@postgres:5432/docpilot}
  DOCPILOT_REDIS_URL: ${DOCPILOT_REDIS_URL:-redis://redis:6379/0}
  DOCPILOT_MINIO_ENDPOINT: ${DOCPILOT_MINIO_ENDPOINT:-minio:9000}
  DOCPILOT_MINIO_ACCESS_KEY: ${DOCPILOT_MINIO_ACCESS_KEY:-docpilot}
  DOCPILOT_MINIO_SECRET_KEY: ${DOCPILOT_MINIO_SECRET_KEY:-docpilot123}
  DOCPILOT_JWT_SECRET: ${DOCPILOT_JWT_SECRET}
  DOCPILOT_SECRETS_KEY: ${DOCPILOT_SECRETS_KEY}
  DOCPILOT_APP_URL: ${DOCPILOT_APP_URL}
  DOCPILOT_API_URL: ${DOCPILOT_API_URL}
  DOCPILOT_CORS_ORIGINS: ${DOCPILOT_CORS_ORIGINS}
  DOCPILOT_AUTH_REQUIRED: ${DOCPILOT_AUTH_REQUIRED:-true}
  DOCPILOT_LANGGRAPH_CHECKPOINTER: ${DOCPILOT_LANGGRAPH_CHECKPOINTER:-postgres}
  DOCPILOT_SMTP_HOST: ${DOCPILOT_SMTP_HOST}
  DOCPILOT_SMTP_USER: ${DOCPILOT_SMTP_USER}
  DOCPILOT_SMTP_FROM: ${DOCPILOT_SMTP_FROM}
  # Resend API is preferred for transactional mail. The lower-case fallback
  # keeps the existing local Windows environment usable without committing it.
  RESEND_API_KEY: ${RESEND_API_KEY:-${resend_api_key:-}}
  DOCPILOT_RESEND_FROM: "${DOCPILOT_RESEND_FROM:-BidPilot <notifications@updates.rglens.com>}"
  DOCPILOT_PROVIDER_DOMESTIC_API_KEY: ${DOCPILOT_PROVIDER_DOMESTIC_API_KEY:-}
  DOCPILOT_PROVIDER_DOMESTIC_BASE_URL: ${DOCPILOT_PROVIDER_DOMESTIC_BASE_URL:-}
  DOCPILOT_PROVIDER_DOMESTIC_MODEL: ${DOCPILOT_PROVIDER_DOMESTIC_MODEL:-}
  DOCPILOT_LLM_MODEL_PRIMARY: ${DOCPILOT_LLM_MODEL_PRIMARY:-}
  DOCPILOT_ASSISTANT_ENGINE: ${DOCPILOT_ASSISTANT_ENGINE:-pi}
  DOCPILOT_PI_AGENT_URL: ${DOCPILOT_PI_AGENT_URL:-http://pi-agent:8787}
  DOCPILOT_PI_TOOL_BRIDGE_URL: ${DOCPILOT_PI_TOOL_BRIDGE_URL:-http://api:8000/internal/pi/tools/execute}
  DOCPILOT_PI_INTERNAL_SECRET: ${DOCPILOT_PI_INTERNAL_SECRET:-${DOCPILOT_JWT_SECRET}}
  DOCPILOT_ASSISTANT_API_KEY: ${DOCPILOT_ASSISTANT_API_KEY:-}
  DOCPILOT_ASSISTANT_PROTOCOL: ${DOCPILOT_ASSISTANT_PROTOCOL:-}
  DOCPILOT_ASSISTANT_PROVIDER_ID: ${DOCPILOT_ASSISTANT_PROVIDER_ID:-}
  DOCPILOT_ASSISTANT_BASE_URL: ${DOCPILOT_ASSISTANT_BASE_URL:-}
  DOCPILOT_ASSISTANT_MODEL: ${DOCPILOT_ASSISTANT_MODEL:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
  OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
  OPENCODE_BASE_URL: ${OPENCODE_BASE_URL:-}
  OPENCODE_MODEL: ${OPENCODE_MODEL:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
  OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-qwen/qwen3-embedding-8b}
  OPENROUTER_EMBEDDING_DIMENSIONS: ${OPENROUTER_EMBEDDING_DIMENSIONS:-1536}
  DOCPILOT_OCR_ENABLED: ${DOCPILOT_OCR_ENABLED:-true}
  DOCPILOT_OCR_LANGS: ${DOCPILOT_OCR_LANGS:-chi_sim+eng}
  DOCPILOT_EMBEDDING_API_KEY: ${DOCPILOT_EMBEDDING_API_KEY:-}
  DOCPILOT_EMBEDDING_BASE_URL: ${DOCPILOT_EMBEDDING_BASE_URL:-}
  DOCPILOT_EMBEDDING_MODEL: ${DOCPILOT_EMBEDDING_MODEL:-}
  DOCPILOT_EMBEDDING_DIMENSIONS: ${DOCPILOT_EMBEDDING_DIMENSIONS:-1536}
  DOCPILOT_TURNSTILE_SECRET_KEY: ${DOCPILOT_TURNSTILE_SECRET_KEY:-}
  # External MCP servers (sensing-only). Value is a JSON array, e.g.
  # [{"name":"tavily","command":"npx","args":["-y","tavily-mcp"],"env":{"TAVILY_API_KEY":"${TAVILY_API_KEY}"}}]
  DOCPILOT_MCP_SERVERS: ${DOCPILOT_MCP_SERVERS:-}
  # API key for the built-in web_search capability (Tavily) and MCP servers.
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: docpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: docpilot
      POSTGRES_USER: docpilot
      POSTGRES_PASSWORD: docpilot
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - docpilot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docpilot -d docpilot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: docpilot-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - docpilot-redis-data:/data

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: docpilot-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: docpilot
      MINIO_ROOT_PASSWORD: docpilot123
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - docpilot-minio-data:/data

  checkpoints:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: docpilot-checkpoints
    restart: "no"
    environment: *docpilot-env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/app/.venv/bin/python", "/app/scripts/setup_langgraph_checkpoints.py"]

  pi-agent:
    build:
      context: .
      dockerfile: services/pi-agent/Dockerfile
    container_name: docpilot-pi-agent
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PI_AGENT_PORT: "8787"
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: docpilot-api
    restart: unless-stopped
    environment: *docpilot-env
    depends_on:
      checkpoints:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      pi-agent:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: docpilot-worker
    restart: unless-stopped
    environment: *docpilot-env
    depends_on:
      checkpoints:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://bidpilot-api.rglens.com}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY}
    container_name: docpilot-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"

volumes:
  docpilot-postgres-data:
  docpilot-redis-data:
  docpilot-minio-data:
