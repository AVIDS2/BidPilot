name: release

on:
  workflow_dispatch:

jobs:
  backend-release-gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: docpilot_test
          POSTGRES_USER: docpilot
          POSTGRES_PASSWORD: docpilot123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DOCPILOT_DATABASE_URL: postgresql://docpilot:docpilot123@localhost:5432/docpilot_test
      DOCPILOT_TEST_DATABASE_URL: postgresql://docpilot:docpilot123@localhost:5432/docpilot_test
      DOCPILOT_REDIS_URL: redis://localhost:6379/0
      DOCPILOT_MINIO_ENDPOINT: localhost:9000
      DOCPILOT_MINIO_ACCESS_KEY: docpilot
      DOCPILOT_MINIO_SECRET_KEY: docpilot123
      DOCPILOT_MINIO_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install uv
      - run: uv sync --directory services/api
      - run: uv sync --directory services/worker
      - name: Start MinIO for object-storage integration tests
        run: |
          docker run --detach --rm --name docpilot-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=docpilot \
            -e MINIO_ROOT_PASSWORD=docpilot123 \
            minio/minio:RELEASE.2025-01-20T14-49-07Z server /data
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO did not become healthy" >&2
          exit 1
      - run: uv run --directory services/api alembic upgrade head
      - run: uv run --directory services/api ruff check app tests
      - run: uv run --directory services/api pytest tests/ -q
      - run: uv run --directory services/worker ruff check app tests
      - run: uv run --directory services/worker pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @docpilot/web exec tsc --noEmit
      - run: pnpm --filter @docpilot/web exec vitest run
      - run: pnpm --filter @docpilot/web run build

  production-readiness:
    # The authoritative production secret gate runs on the VPS immediately
    # before deployment. Enable this mirror only after equivalent GitHub
    # Actions secrets have been deliberately provisioned.
    if: ${{ vars.DOCPILOT_VERIFY_PRODUCTION_ENV == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate production readiness
        run: python scripts/production_readiness.py --target production
        env:
          DOCPILOT_DATABASE_URL: postgresql+psycopg://${{ secrets.DOCPILOT_POSTGRES_USER }}:${{ secrets.DOCPILOT_DATABASE_PASSWORD }}@${{ secrets.DOCPILOT_DATABASE_HOST }}:5432/${{ secrets.DOCPILOT_POSTGRES_DB }}
          DOCPILOT_REDIS_URL: redis://:${{ secrets.DOCPILOT_REDIS_PASSWORD }}@${{ secrets.DOCPILOT_REDIS_HOST }}:6379/0
          DOCPILOT_RATE_LIMIT: "1000/minute"
          DOCPILOT_OFFICIAL_MONTHLY_TOKEN_CEILING: ${{ vars.DOCPILOT_OFFICIAL_MONTHLY_TOKEN_CEILING }}
          DOCPILOT_TRUSTED_PROXY_CIDRS: ${{ secrets.DOCPILOT_TRUSTED_PROXY_CIDRS }}
          DOCPILOT_MINIO_ENDPOINT: ${{ secrets.DOCPILOT_MINIO_ENDPOINT }}
          DOCPILOT_MINIO_ACCESS_KEY: ${{ secrets.DOCPILOT_MINIO_ACCESS_KEY }}
          DOCPILOT_MINIO_SECRET_KEY: ${{ secrets.DOCPILOT_MINIO_SECRET_KEY }}
          DOCPILOT_JWT_SECRET: ${{ secrets.DOCPILOT_JWT_SECRET }}
          DOCPILOT_AUTH_REQUIRED: "true"
          DOCPILOT_SECRETS_KEY: ${{ secrets.DOCPILOT_SECRETS_KEY }}
          DOCPILOT_APP_URL: ${{ secrets.DOCPILOT_APP_URL }}
          DOCPILOT_CORS_ORIGINS: ${{ secrets.DOCPILOT_CORS_ORIGINS }}
          DOCPILOT_ENV: production
          DOCPILOT_LANGGRAPH_CHECKPOINTER: postgres
          DOCPILOT_AGENT_CHECKPOINTER: postgres
          DOCPILOT_ASSISTANT_ENGINE: harness
          USE_LANGGRAPH: "true"
          DOCPILOT_POSTGRES_DB: ${{ secrets.DOCPILOT_POSTGRES_DB }}
          DOCPILOT_POSTGRES_USER: ${{ secrets.DOCPILOT_POSTGRES_USER }}
          DOCPILOT_POSTGRES_PASSWORD: ${{ secrets.DOCPILOT_DATABASE_PASSWORD }}
          DOCPILOT_REDIS_PASSWORD: ${{ secrets.DOCPILOT_REDIS_PASSWORD }}
          DOCPILOT_SMTP_HOST: ${{ secrets.DOCPILOT_SMTP_HOST }}
          DOCPILOT_SMTP_USER: ${{ secrets.DOCPILOT_SMTP_USER }}
          DOCPILOT_SMTP_PASS: ${{ secrets.DOCPILOT_SMTP_PASS }}
          DOCPILOT_SMTP_FROM: ${{ secrets.DOCPILOT_SMTP_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DOCPILOT_RESEND_FROM: ${{ secrets.DOCPILOT_RESEND_FROM }}
          DOCPILOT_PROVIDER_DOMESTIC_API_KEY: ${{ secrets.DOCPILOT_PROVIDER_DOMESTIC_API_KEY }}
