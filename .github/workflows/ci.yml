name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  api-lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: docpilot_test
          POSTGRES_USER: docpilot
          POSTGRES_PASSWORD: docpilot123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DOCPILOT_DATABASE_URL: postgresql://docpilot:docpilot123@localhost:5432/docpilot_test
      DOCPILOT_TEST_DATABASE_URL: postgresql://docpilot:docpilot123@localhost:5432/docpilot_test
      DOCPILOT_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install uv
      - name: Install workspace deps
        run: uv sync --all-packages --locked
      - name: Lint
        working-directory: services/api
        run: uv run --locked --no-sync ruff check app/ tests/
      - name: Type check
        working-directory: services/api
        run: uv run --locked --no-sync mypy app/ --ignore-missing-imports
      - name: Run migrations
        working-directory: services/api
        run: uv run --locked --no-sync alembic upgrade head
      - name: Verify migration health
        working-directory: services/api
        run: uv run --locked --no-sync python ../../scripts/verify_migration_health.py
      - name: Test
        working-directory: services/api
        run: uv run --locked --no-sync pytest tests/ -v --tb=short

  worker-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: docpilot_test
          POSTGRES_USER: docpilot
          POSTGRES_PASSWORD: docpilot123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DOCPILOT_DATABASE_URL: postgresql://docpilot:docpilot123@localhost:5432/docpilot_test
      DOCPILOT_TEST_DATABASE_URL: postgresql://docpilot:docpilot123@localhost:5432/docpilot_test
      DOCPILOT_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install uv
      - name: Install workspace deps
        run: uv sync --all-packages --locked
      - name: Run migrations
        working-directory: services/api
        run: uv run --locked --no-sync alembic upgrade head
      - name: Lint
        working-directory: services/worker
        run: uv run --locked --no-sync ruff check app/ tests/
      - name: Test
        working-directory: services/worker
        run: uv run --locked --no-sync pytest tests/ -v --tb=short

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Typecheck
        run: pnpm --filter @docpilot/web exec tsc --noEmit
      - name: Unit tests
        run: pnpm --filter @docpilot/web exec vitest run
      - name: Build
        run: pnpm --filter @docpilot/web run build
      - name: Lint
        run: pnpm --filter @docpilot/web run lint
