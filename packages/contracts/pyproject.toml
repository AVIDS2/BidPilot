[project]
name = "contracts"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.39",
    "pgvector>=0.4.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["contracts"]

[tool.setuptools.package-dir]
contracts = "."
