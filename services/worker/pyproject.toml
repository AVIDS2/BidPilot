[project]
name = "docpilot-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "celery[redis]>=5.5.0",
  "contracts",
  "cryptography>=48.0.1",
  "bcrypt>=4.0.0",
  "fastapi>=0.115.12",
  "httpx>=0.28.1",
  "langchain-anthropic>=0.3",
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "langgraph-checkpoint-postgres>=2.0",
  "langgraph>=0.4.0",
  "minio>=7.2.20",
  "openpyxl>=3.1.5",
  "PyJWT>=2.8.0",
  "pgvector>=0.4.0",
  "psycopg[binary]>=3.2.0",
  "pymupdf>=1.27.2.2",
  "python-docx>=1.2.0",
  "sqlalchemy>=2.0.39",
  "tenacity>=9.0.0",
  "trafilatura>=2.0.0",
  "mem0ai==2.0.18",
]

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.15.22,<0.16.0",
]

[tool.uv.sources]
contracts = { workspace = true }
