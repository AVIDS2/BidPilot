[project]
name = "docpilot-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.15.0",
  "bcrypt>=4.0.0",
  "celery[redis]>=5.5.0",
  "contracts",
  "fastapi>=0.115.12",
  "minio>=7.2.20",
  "pgvector>=0.4.2",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.11.0",
  "PyJWT>=2.8.0",
  "python-dotenv>=1.0.0",
  "python-docx>=1.2.0",
  "reportlab>=4.4.0",
  "python-multipart>=0.0.26",
  "redis>=5.0.0",
  "sqlalchemy>=2.0.39",
  "sse-starlette>=2.1.0",
  "structlog>=24.0.0",
  "uvicorn>=0.34.0",
  "cryptography>=48.0.1",
  "slowapi>=0.1.9",
  "openai-agents>=0.17.5",
]

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "httpx>=0.28.1"
]

[tool.uv.sources]
contracts = { workspace = true }
