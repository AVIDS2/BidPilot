[project]
name = "docpilot-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.15.0",
  "bcrypt>=4.0.0",
  "celery[redis]>=5.5.0",
  "contracts",
  "fastapi>=0.115.12",
  "httpx>=0.28.1",
  "minio>=7.2.20",
  "openpyxl>=3.1.5",
  "pgvector>=0.4.2",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.11.0",
  "PyJWT>=2.8.0",
  "python-dotenv>=1.0.0",
  "python-docx>=1.2.0",
  "PyMuPDF>=1.26.0,<2.0.0",
  "reportlab>=4.4.0",
  "python-multipart>=0.0.26",
  "redis>=5.0.0",
  "sqlalchemy>=2.0.39",
  "sse-starlette>=2.1.0",
  "structlog>=24.0.0",
  "uvicorn>=0.34.0",
  "cryptography>=48.0.1",
  "openai-agents>=0.17.5",
  "langgraph>=0.4.0",
  "langgraph-checkpoint-postgres>=2.0",
  "langchain-core>=0.3",
  "langchain-anthropic>=0.3",
  "langchain-openai>=0.3",
  "stripe>=15.3.1",
]

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3.5",
  "ruff>=0.15.22,<0.16.0",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[tool.ruff.lint.per-file-ignores]
# `app.main` intentionally loads the local development environment before
# importing settings-consuming application modules.
"app/main.py" = ["E402"]

[tool.uv.sources]
contracts = { workspace = true }
