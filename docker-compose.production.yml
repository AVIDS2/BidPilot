services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: bidpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DOCPILOT_POSTGRES_DB:?DOCPILOT_POSTGRES_DB is required}
      POSTGRES_USER: ${DOCPILOT_POSTGRES_USER:?DOCPILOT_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${DOCPILOT_POSTGRES_PASSWORD:?DOCPILOT_POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - bidpilot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    container_name: bidpilot-redis
    restart: unless-stopped
    environment:
      DOCPILOT_REDIS_PASSWORD: ${DOCPILOT_REDIS_PASSWORD:?DOCPILOT_REDIS_PASSWORD is required}
    command:
      - sh
      - -ec
      - 'exec redis-server --appendonly yes --requirepass "$$DOCPILOT_REDIS_PASSWORD"'
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - bidpilot-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$DOCPILOT_REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: bidpilot-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${DOCPILOT_MINIO_ACCESS_KEY:?DOCPILOT_MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${DOCPILOT_MINIO_SECRET_KEY:?DOCPILOT_MINIO_SECRET_KEY is required}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - bidpilot-minio-data:/data

  readiness:
    build:
      context: ./repo
      dockerfile: services/api/Dockerfile
    container_name: bidpilot-readiness
    restart: "no"
    env_file:
      - .env
    environment:
      DOCPILOT_ENV: production
    command: ["/app/.venv/bin/python", "/app/scripts/production_readiness.py", "--target", "production"]

  migrate:
    build:
      context: ./repo
      dockerfile: services/api/Dockerfile
    container_name: bidpilot-migrate
    restart: "no"
    env_file:
      - .env
    environment:
      DOCPILOT_ENV: production
    depends_on:
      readiness:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: ["/app/.venv/bin/alembic", "-c", "/app/services/api/alembic.ini", "upgrade", "head"]

  checkpoints:
    build:
      context: ./repo
      dockerfile: services/api/Dockerfile
    container_name: bidpilot-checkpoints
    restart: "no"
    env_file:
      - .env
    environment:
      DOCPILOT_ENV: production
      DOCPILOT_LANGGRAPH_CHECKPOINTER: postgres
      DOCPILOT_AGENT_CHECKPOINTER: postgres
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: ["/app/.venv/bin/python", "/app/scripts/setup_langgraph_checkpoints.py"]

  pi-agent:
    build:
      context: ./repo
      dockerfile: services/pi-agent/Dockerfile
    container_name: bidpilot-pi-agent
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PI_AGENT_PORT: "8787"
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./repo
      dockerfile: services/api/Dockerfile
    container_name: bidpilot-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DOCPILOT_ENV: production
      DOCPILOT_AUTH_REQUIRED: "true"
      DOCPILOT_LANGGRAPH_CHECKPOINTER: postgres
      DOCPILOT_AGENT_CHECKPOINTER: postgres
      DOCPILOT_ASSISTANT_ENGINE: pi
      DOCPILOT_PI_AGENT_URL: http://pi-agent:8787
      DOCPILOT_PI_TOOL_BRIDGE_URL: http://api:8000/internal/pi/tools/execute
      DOCPILOT_PI_INTERNAL_SECRET: ${DOCPILOT_PI_INTERNAL_SECRET:?DOCPILOT_PI_INTERNAL_SECRET is required}
      DOCPILOT_INTERNAL_UNLIMITED_USAGE: ${DOCPILOT_INTERNAL_UNLIMITED_USAGE:-false}
    depends_on:
      checkpoints:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      pi-agent:
        condition: service_healthy
    ports:
      - "127.0.0.1:3101:8000"
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: ./repo
      dockerfile: services/worker/Dockerfile
    container_name: bidpilot-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DOCPILOT_ENV: production
      DOCPILOT_AUTH_REQUIRED: "true"
      DOCPILOT_LANGGRAPH_CHECKPOINTER: postgres
      DOCPILOT_AGENT_CHECKPOINTER: postgres
      USE_LANGGRAPH: "true"
      DOCPILOT_INTERNAL_UNLIMITED_USAGE: ${DOCPILOT_INTERNAL_UNLIMITED_USAGE:-false}
    depends_on:
      checkpoints:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  worker-beat:
    build:
      context: ./repo
      dockerfile: services/worker/Dockerfile
    container_name: bidpilot-worker-beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DOCPILOT_ENV: production
      DOCPILOT_AUTH_REQUIRED: "true"
      DOCPILOT_LANGGRAPH_CHECKPOINTER: postgres
      DOCPILOT_AGENT_CHECKPOINTER: postgres
      DOCPILOT_INTERNAL_UNLIMITED_USAGE: ${DOCPILOT_INTERNAL_UNLIMITED_USAGE:-false}
    command: ["/app/.venv/bin/celery", "-A", "app.celery_app", "beat", "--loglevel=info"]
    depends_on:
      checkpoints:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  web:
    build:
      context: ./repo
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://bidpilot-api.rglens.com}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY}
    container_name: bidpilot-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:80"

volumes:
  bidpilot-postgres-data:
  bidpilot-redis-data:
  bidpilot-minio-data:
