services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: bidpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bidpilot
      POSTGRES_USER: bidpilot
      POSTGRES_PASSWORD: bidpilot
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - bidpilot-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    container_name: bidpilot-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - bidpilot-redis-data:/data

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: bidpilot-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bidpilot
      MINIO_ROOT_PASSWORD: bidpilot123
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - bidpilot-minio-data:/data

  api:
    build:
      context: ./repo
      dockerfile: services/api/Dockerfile
    container_name: bidpilot-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DOCPILOT_AUTH_REQUIRED: "true"
      DOCPILOT_LANGGRAPH_CHECKPOINTER: postgres
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - "127.0.0.1:3101:8000"

  worker:
    build:
      context: ./repo
      dockerfile: services/worker/Dockerfile
    container_name: bidpilot-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DOCPILOT_AUTH_REQUIRED: "true"
      DOCPILOT_LANGGRAPH_CHECKPOINTER: postgres
    depends_on:
      - postgres
      - redis
      - minio

  web:
    build:
      context: ./repo
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://bidpilot-api.rglens.com}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY}
    container_name: bidpilot-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:3100:80"

volumes:
  bidpilot-postgres-data:
  bidpilot-redis-data:
  bidpilot-minio-data:
